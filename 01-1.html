<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=circle" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check_circle" />
    <style>
        header {
            padding: 16px 0;
            font-size: 36px;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            font-weight: 700;
            text-align: center;
            z-index: 2;
            background-color: white;
            border-bottom: 1px solid;
        }

        main {

            justify-content: center;
            align-items: center;

        }

        main img {
            margin: auto;
            width: 100%;
            vertical-align: top;
            max-width: 759px;
            position: relative;
            height: 788px;
            z-index: 1;
            display: flex;
            box-sizing: content-box;
            vertical-align: baseline;

        }

        .inner-box {
            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid;
            height: 349px;
            width: 759px;
            margin: 0 auto;
            border-radius: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 21px;
            font-weight: 400;
            padding: 40px 30px 40px 30px;

        }

        .start-box {
            border: 1px solid;
            padding: 15px;
            width: 682px;
            height: 212px;
            font-size: 18px;
            background-color: rgb(245, 245, 245);
            font-weight: 400;
            margin-top: 20px;
            flex-direction: column;
        }

        .inner-box4 {
            display: block;
            font-size: 18px;
            font-weight: 400;
            width: 759px;
            height: 102px;
            text-align: left;
            padding: 10px;
            justify-content: center;
            margin: 0 auto;
        }

        .checkbox-group {

            align-items: center;

        }


        footer {
            border-top: 1px solid;
            text-align: center;
            color: rgb(148, 143, 6);
            font-size: 36px;
            padding: 23px 0 23px 0;
        }

        /* 기본 체크박스 숨기기 */
        .custom-checkbox input[type="checkbox"] {
            display: none;
        }

        /* 체크 안 된 상태 아이콘 */
        .custom-checkbox .icon-checked {
            display: none;
        }

        /* 체크된 상태 아이콘 전환 */
        .custom-checkbox input[type="checkbox"]:checked~.icon-unchecked {
            display: none;
        }

        .custom-checkbox input[type="checkbox"]:checked~.icon-checked {
            display: inline-block;
            color: rgb(148, 143, 6);
            /* 구글 브랜드 블루 색상 예시 */
        }

        /* 아이콘 정렬 및 간격 */
        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 8px;
            user-select: none;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <header>영양진단 서비스</header>

        <div class="main-wrapper">
            <main>
                <section class="visual-section">
                    <img src="화면구현1.png" alt="메인 이미지">
                </section>

                <section class="inner-box">
                    <div class="inner-box2">
                        <label>
                            <input type="checkbox">
                            <span>(필수) 개인 정보 수집•이용에 모두 동의합니다.</span>

                            <div class="start-box">
                                <p>
                                    뉴트릿은 영양진단 서비스 제공을 위하여 개인정보(민감정보 포함)를 수집·이용하고 있습니다. 내용을 자세히 읽으신 후 동의 여부를 결정해
                                    주십시오.
                                </p>
                                <div class="checkbox-group">
                                    <label class="custom-checkbox">
                                        <input type="checkbox" id="check1">
                                        <span class="material-symbols-outlined icon-unchecked">circle</span>
                                        <span class="material-symbols-outlined icon-checked">check_circle</span>
                                    </label>

                                    <div>
                                        <strong>필수</strong>
                                        <span>개인 정보 수집•이용동의</span>
                                    </div>
                                    <input type="checkbox" class="checkbox-input">
                                    <label>
                                        <strong>필수</strong>
                                        <span>민감 정보 수집•이용동의</span>
                                    </label>
                                </div>

                            </div>

                        </label>
                    </div>

                </section>
            </main>
            <label class="inner-box4">
                만 14세 미만 아동은 서비스 이용이 제한됩니다.
                본인은 만 14세 이상으로 개인정보 및 약관 동의 내용을 확인하였으며, 위 내용에 동의합니다.
            </label>
            <footer>
                식습관 진단 받기
            </footer>
        </div>
    </div>

</body>

</html>
