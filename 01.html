<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            padding: 16px 0;
            font-size: 16px;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            font-weight: 700;
            text-align: center;
            z-index: 2;
            background-color: white;
            border-bottom: 1px solid;
        }

        main {

            justify-content: center;
            align-items: center;

        }

        main img {
            margin: auto;
            width: 100%;
            vertical-align: top;
            max-width: 759px;
            position: relative;
            height: 788px;
            z-index: 1;
            display: flex;
            box-sizing: content-box;
            vertical-align: baseline;

        }

        .inner-box {
            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid;
            height: 349px;
            width: 759px;
            margin: 0 auto;
            border-radius: 3%;
            margin-top: 20px;
        }

        .inner-box3{
            border: 1px solid;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <header>영양진단 서비스</header>

        <div class="main-wrapper">
            <main>
                <section class="visual-section">
                    <img src="화면구현1.png" alt="메인 이미지">
                </section>

                <section class="inner-box">
                    <div class="inner-box2">
                        <label>
                            <input type="checkbox">
                            <span>(필수) 개인 정보 수집 이용에 동의합니다.</span>
                            <div class="inner-box3">
                                뉴트릿은 영양 진단 서비스 제공을 위하여 개인정보(민감정보 포함)르 수집, 이용하고 있습니다.
                            </div>
                        </label>
                    </div>
                </section>
        </div>

        </section>

        </main>
    </div>




    </div>

</body>

</html>
